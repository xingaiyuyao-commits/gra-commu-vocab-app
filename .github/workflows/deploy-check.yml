name: deploy-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:deploy
        env:
          PDF_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/pdf-learner
      - name: Save PDF learner acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-learner-acceptance
          path: ${{ runner.temp }}/pdf-learner
          if-no-files-found: ignore
      - name: Run 100-client quiz load gate
        run: npm run test:load
        timeout-minutes: 2
        env:
          QUIZ_LOAD_TIMEOUT_MS: "60000"
