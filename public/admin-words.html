<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>✏️ 単語リスト編集</title>
<style>
  :root {
    --background: oklch(98.5% .002 247);
    --foreground: oklch(14.5% .02 265);
    --card: oklch(100% 0 0);
    --card-foreground: oklch(14.5% .02 265);
    --primary: oklch(45% .18 265);
    --primary-foreground: oklch(98.5% .002 247);
    --secondary: oklch(96% .01 265);
    --muted-foreground: oklch(50% .02 265);
    --accent: oklch(94% .02 265);
    --destructive: oklch(57.7% .245 27.325);
    --border: oklch(90% .01 265);
    --green: oklch(62.7% .194 149.214);
    --gold: oklch(79.5% .184 86.047);
    --radius: .625rem;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    background: linear-gradient(135deg, var(--background), var(--background) 60%, oklch(45% .18 265 / .05));
    color: var(--foreground);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .container { width: 100%; max-width: 56rem; }
  .site-header { position: relative; min-height: 76px; padding: 8px 66px 0; margin-bottom: 12px; text-align: center; }
  .site-header .voice-logo { position: absolute; top: 0; left: 0; width: 56px; height: 45px; object-fit: contain; }
  .site-title { margin: 0; font-size: 1.55rem; font-weight: 800; letter-spacing: -.045em; }
  .site-tagline { margin-top: 3px; color: var(--muted-foreground); font-size: .78rem; font-weight: 600; }
  .screen { display: none; }
  .screen.active { display: block; }
  h1 { text-align: center; font-size: 1.6rem; font-weight: 700; letter-spacing: -.025em; margin: 20px 0 8px; }
  .subtitle { text-align: center; color: var(--muted-foreground); font-size: .875rem; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: .75rem;
    box-shadow: 0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
    padding: 20px;
    margin-bottom: 16px;
  }
  label { font-size: .875rem; font-weight: 500; display: block; margin-bottom: 6px; }
  input, select {
    width: 100%;
    height: 2.4rem;
    padding: 0 10px;
    border-radius: calc(var(--radius) - 2px);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-size: .9rem;
  }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: calc(var(--radius) - 2px);
    font-weight: 600;
    font-size: .9rem;
    padding: 0 16px;
    height: 2.4rem;
  }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .btn-primary:hover { opacity: .92; }
  .btn-secondary { background: var(--secondary); color: var(--foreground); }
  .btn-danger { background: transparent; color: var(--destructive); border: 1px solid var(--destructive); }
  .btn-danger:hover { background: oklch(57.7% .245 27.325 / .08); }
  .top-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .top-bar select { width: auto; min-width: 140px; }
  .top-bar .spacer { flex: 1; }
  .series-block { margin-bottom: 18px; }
  .series-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .series-count { font-size: .8rem; color: var(--muted-foreground); font-weight: 400; }
  .item-row {
    display: grid;
    grid-template-columns: 2.4fr 1fr 1fr 1.4fr 2fr auto;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .item-row input { font-size: .85rem; }
  .item-row .field-label { font-size: .7rem; color: var(--muted-foreground); margin-bottom: 3px; display: none; }
  .item-num { font-size: .8rem; color: var(--muted-foreground); width: 1.6rem; text-align: right; flex-shrink: 0; }
  .item-row-wrap { display: flex; align-items: center; gap: 8px; }
  .del-btn {
    background: transparent; border: none; color: var(--muted-foreground); font-size: 1.1rem;
    width: 2rem; height: 2rem; border-radius: 999px; flex-shrink: 0;
  }
  .del-btn:hover { background: oklch(57.7% .245 27.325 / .1); color: var(--destructive); }
  .add-row-btn { margin-top: 4px; }
  .col-headers { display: grid; grid-template-columns: 2.4fr 1fr 1fr 1.4fr 2fr auto; gap: 8px; margin-bottom: 4px; padding-left: 1.6rem; }
  .col-headers span { font-size: .72rem; color: var(--muted-foreground); font-weight: 600; padding-left: 10px; }
  .msg { font-size: .85rem; padding: 10px 12px; border-radius: calc(var(--radius) - 2px); margin-bottom: 14px; }
  .msg.error { background: oklch(57.7% .245 27.325 / .08); color: var(--destructive); white-space: pre-wrap; }
  .msg.success { background: oklch(62.7% .194 149.214 / .1); color: var(--green); }
  .save-bar { position: sticky; bottom: 0; background: var(--background); padding: 12px 0; display: flex; justify-content: flex-end; gap: 10px; }
  .login-card { max-width: 22rem; margin: 15vh auto 0; }
</style>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img class="voice-logo" src="/assets/voice-logo.png" alt="VOICE" width="218" height="176" />
      <p class="site-title">ÖSH Vocabulary Challenge</p>
      <p class="site-tagline">みんなで満点を目指そう！</p>
    </header>
    <h1>✏️ 単語リスト編集</h1>
    <p class="subtitle">Clacel / IELTS / TOEIC の語彙データを直接編集します</p>

    <div id="screen-login" class="screen active">
      <div class="card login-card">
        <label for="pw-input">パスワード</label>
        <input id="pw-input" type="password" placeholder="パスワード" />
        <button class="btn-primary" style="width:100%; margin-top:12px;" onclick="login()">入る</button>
        <p id="login-error" class="msg error" style="display:none; margin-top:12px;"></p>
      </div>
    </div>

    <div id="screen-editor" class="screen">
      <div class="top-bar">
        <select id="category-select" onchange="loadCategory()">
          <option value="clacel">Clacel</option>
          <option value="ielts">IELTS</option>
          <option value="toeic">TOEIC</option>
        </select>
        <span class="spacer"></span>
        <button class="btn-secondary" onclick="loadCategory()">再読み込み</button>
      </div>

      <div id="messages"></div>
      <div id="series-container"></div>

      <div class="save-bar">
        <button class="btn-secondary" onclick="logout()">ログアウト</button>
        <button class="btn-primary" onclick="saveCategory()">保存する</button>
      </div>
    </div>
  </div>

<script>
  let currentData = null;

  function $(id) { return document.getElementById(id); }
  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    $(id).classList.add("active");
  }
  function pw() { return sessionStorage.getItem("adminPw") || ""; }

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { "Content-Type": "application/json", "X-Admin-Password": pw() },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data.error || "エラーが発生しました");
      err.details = data.details;
      err.status = res.status;
      throw err;
    }
    return data;
  }

  async function login() {
    const val = $("pw-input").value;
    sessionStorage.setItem("adminPw", val);
    try {
      await api("GET", "/api/admin/wordtests/clacel");
      show("screen-editor");
      loadCategory();
    } catch (e) {
      $("login-error").style.display = "block";
      $("login-error").textContent = e.status === 401 ? "パスワードが違います" : e.message;
      sessionStorage.removeItem("adminPw");
    }
  }

  function logout() {
    sessionStorage.removeItem("adminPw");
    show("screen-login");
  }

  async function loadCategory() {
    $("messages").innerHTML = "";
    const category = $("category-select").value;
    try {
      currentData = await api("GET", `/api/admin/wordtests/${category}`);
      renderEditor();
    } catch (e) {
      if (e.status === 401) return logout();
      $("messages").innerHTML = `<div class="msg error">読み込み失敗: ${escapeHtml(e.message)}</div>`;
    }
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderEditor() {
    const container = $("series-container");
    container.innerHTML = currentData.series.map((s, si) => `
      <div class="series-block">
        <div class="series-title">${escapeHtml(s.name)} <span class="series-count">(${s.items.length}語)</span></div>
        <div class="col-headers">
          <span>例文（___ が空所）</span><span>answer</span><span>base</span><span>ja（意味）</span><span>sentenceJa（例文和訳）</span><span></span>
        </div>
        <div id="items-${si}"></div>
        <button class="btn-secondary add-row-btn" onclick="addItem(${si})">＋ 単語を追加</button>
      </div>
    `).join("");
    currentData.series.forEach((s, si) => renderItems(si));
  }

  function renderItems(si) {
    const s = currentData.series[si];
    $(`items-${si}`).innerHTML = s.items.map((it, ii) => `
      <div class="item-row-wrap">
        <span class="item-num">${ii + 1}.</span>
        <div class="item-row">
          <input value="${escapeHtml(it.sentence)}" oninput="updateItem(${si},${ii},'sentence',this.value)" />
          <input value="${escapeHtml(it.answer)}" oninput="updateItem(${si},${ii},'answer',this.value)" />
          <input value="${escapeHtml(it.base)}" oninput="updateItem(${si},${ii},'base',this.value)" />
          <input value="${escapeHtml(it.ja)}" oninput="updateItem(${si},${ii},'ja',this.value)" />
          <input value="${escapeHtml(it.sentenceJa)}" oninput="updateItem(${si},${ii},'sentenceJa',this.value)" />
          <button class="del-btn" onclick="removeItem(${si},${ii})" title="削除">✕</button>
        </div>
      </div>
    `).join("");
  }

  function updateItem(si, ii, field, value) {
    currentData.series[si].items[ii][field] = value;
  }

  function removeItem(si, ii) {
    currentData.series[si].items.splice(ii, 1);
    renderItems(si);
    renderCounts();
  }

  function addItem(si) {
    currentData.series[si].items.push({ sentence: "___", answer: "", base: "", ja: "", sentenceJa: "" });
    renderItems(si);
    renderCounts();
  }

  function renderCounts() {
    document.querySelectorAll(".series-count").forEach((el, si) => {
      el.textContent = `(${currentData.series[si].items.length}語)`;
    });
  }

  async function saveCategory() {
    const category = $("category-select").value;
    $("messages").innerHTML = "";
    try {
      await api("POST", `/api/admin/wordtests/${category}`, currentData);
      $("messages").innerHTML = `<div class="msg success">保存しました</div>`;
    } catch (e) {
      if (e.status === 401) return logout();
      const details = e.details ? "\n" + e.details.join("\n") : "";
      $("messages").innerHTML = `<div class="msg error">${escapeHtml(e.message + details)}</div>`;
    }
  }

  if (pw()) {
    api("GET", "/api/admin/wordtests/clacel")
      .then(() => { show("screen-editor"); loadCategory(); })
      .catch(() => show("screen-login"));
  }
</script>
</body>
</html>
