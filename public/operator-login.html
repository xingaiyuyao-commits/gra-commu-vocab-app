<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>運営者ログイン | ÖSH Vocabulary Challenge</title>
<style>
  :root { --paper:#fff; --ink:#202020; --muted:#777; --line:#dededb; --gold:#c99820; }
  * { box-sizing:border-box; }
  body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family:Arial,"Helvetica Neue","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif; }
  main { width:min(100%,520px); }
  .brand { text-align:center; margin-bottom:28px; }
  .voice-logo { width:58px; height:46px; object-fit:contain; mix-blend-mode:multiply; }
  h1 { margin:10px 0 4px; font-size:clamp(2rem,7vw,3rem); font-weight:800; letter-spacing:-.075em; line-height:.95; }
  .tagline { margin:0; color:var(--muted); font-weight:600; }
  .card { padding:28px; border:1px solid var(--line); border-radius:18px; box-shadow:0 8px 28px rgba(0,0,0,.06); }
  h2 { margin:0 0 8px; font-size:1.35rem; }
  .note { margin:0 0 22px; color:var(--muted); line-height:1.65; }
  label { display:block; margin-bottom:8px; font-weight:700; }
  input { width:100%; height:52px; padding:0 14px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  button { width:100%; min-height:52px; margin-top:16px; border:0; border-radius:10px; background:var(--ink); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  .error { min-height:1.5em; margin:12px 0 0; color:#b3473f; text-align:center; }
  .home { display:block; margin-top:20px; color:var(--muted); text-align:center; text-underline-offset:5px; }
</style>
</head>
<body>
<main>
  <header class="brand">
    <img class="voice-logo" src="/assets/voice-logo.png" alt="VOICE" width="218" height="176" />
    <h1>ÖSH Vocabulary Challenge</h1>
    <p class="tagline">みんなで満点を目指そう！</p>
  </header>
  <section class="card">
    <h2>運営者ログイン</h2>
    <p class="note">Zoomの画面共有を始める前にログインしてください。ログイン状態は12時間保持されます。</p>
    <form id="operator-login-form">
      <label for="operator-password">共有パスワード</label>
      <input id="operator-password" name="password" type="password" autocomplete="current-password" required />
      <button id="operator-login-button" type="submit">ログイン</button>
    </form>
    <p class="error" id="operator-login-error" role="alert"></p>
    <a class="home" href="/">ホームに戻る</a>
  </section>
</main>
<script>
  const form = document.getElementById("operator-login-form");
  const input = document.getElementById("operator-password");
  const button = document.getElementById("operator-login-button");
  const error = document.getElementById("operator-login-error");

  fetch("/api/operator/session", { cache: "no-store" })
    .then((response) => { if (response.ok) location.replace("/"); })
    .catch(() => {});

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    button.disabled = true;
    error.textContent = "";
    try {
      const response = await fetch("/api/operator/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: input.value }),
      });
      const body = await response.json().catch(() => ({}));
      input.value = "";
      if (!response.ok) {
        error.textContent = body.error || "ログインできませんでした";
        return;
      }
      location.replace("/");
    } catch {
      error.textContent = "通信できませんでした。接続を確認してもう一度お試しください";
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
